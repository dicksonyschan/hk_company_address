cr:
  # data.gov.hk resource: 2bbe945a-9346-4526-8dbb-b8fb4cb05aef
  # 參數格式: query[0][key1]=Comp_name&query[0][key2]=begins_with&query[0][key3]=<prefix>&format=json
  base_url: "https://data.cr.gov.hk/cr/api/api/v1/api_builder/json/local/search"
  raw_dir: "data/raw"
  request_timeout: 30      # 秒
  retry_attempts: 4
  downloader: prefix        # "prefix"=前綴掃描（預設）, "brn"=BRN 盲查
  # 注意：API 每次回傳上限 100 筆（max/skip 參數無效）
  # 程式自動使用遞迴前綴展開策略完成全量下載

cr_brn:
  mode: numeric             # "numeric" 或 "prefix"

  # numeric 模式
  start: 0
  end: 99999999

  # prefix 模式
  prefixes: ["C", "G", "L", "F", "E", "H", "N", "U", "Z", "B", "D"]
  prefix_start: 1000000
  prefix_end: 4000000

  # 共用參數
  fetch_batch_size: 10000   # 每次執行隨機抽取筆數
  concurrency: 20           # 並發查詢數
  miss_limit: 2000          # 本批連續 miss 門檻（不終止整體掃描）
  batch_write: 2000         # hit 記錄 Parquet flush 門檻
  jitter_min: 0.05          # 最小 Jitter 延遲（秒）
  jitter_max: 0.30          # 最大 Jitter 延遲（秒）
  cb_threshold: 10          # Circuit Breaker 連續失敗門檻
  cb_cooldown: 60           # Circuit Breaker 冷卻時間（秒）

als:
  base_url: "https://www.als.ogcio.gov.hk/lookup"
  concurrency: 10          # 同時連線數（提升至 10）
  rate_limit: 20           # 每秒最大請求數（提升至 20）
  confidence_threshold: 70 # 低於此分數標記人工覆核
  request_timeout: 5       # 秒
  retry_attempts: 3
  result_count: 1          # 每次查詢回傳筆數 (取最高分)

db:
  path: "data/hk_companies.duckdb"

logging:
  level: "INFO"
  file: "data/pipeline.log"

alias_map_path: "data/alias_map.json"

industry:
  keywords_path: data/industry_keywords.json
  confidence_threshold: 0.8
  enable_llm_fallback: true
  enable_llm_keyword_mining: true
  deepseek_model: deepseek-v4-flash
  auto_mine_threshold: 10000
  batch_size: 50
