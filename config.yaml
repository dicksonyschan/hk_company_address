cr:
  base_url: "https://data.cr.gov.hk/cr/api/api/v1/api_builder/json/local/search"
  page_size: 1000          # 每頁抓取筆數
  chunk_size: 10000        # Polars streaming chunk
  raw_dir: "data/raw"
  request_timeout: 30      # 秒
  retry_attempts: 3

als:
  base_url: "https://www.als.ogcio.gov.hk/lookup"
  concurrency: 10          # 同時連線數（提升至 10）
  rate_limit: 20           # 每秒最大請求數（提升至 20）
  confidence_threshold: 70 # 低於此分數標記人工覆核
  request_timeout: 5       # 秒
  retry_attempts: 3
  result_count: 1          # 每次查詢回傳筆數 (取最高分)

db:
  path: "data/hk_companies.duckdb"

logging:
  level: "INFO"
  file: "data/pipeline.log"

alias_map_path: "data/alias_map.json"

industry:
  keywords_path: data/industry_keywords.json
  confidence_threshold: 0.8
  enable_llm_fallback: true
  enable_llm_keyword_mining: true
  deepseek_model: deepseek-v4-flash
  auto_mine_threshold: 10000
  batch_size: 50
